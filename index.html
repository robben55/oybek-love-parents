<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ойбек</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .card {
      width: min(680px, calc(100% - 32px));
      padding: 56px 32px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(23, 32, 51, 0.10);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(42px, 8vw, 72px);
    }

    p {
      margin: 0;
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1.35;
    }

    .heart {
      font-size: 0.9em;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Я Ойбек <span class="heart">❤️</span></h1>
    <p>Я люблю своих родителей</p>
  </main>
</body>
</html>

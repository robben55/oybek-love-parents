<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#060610" />
  <meta name="description" content="Ойбек любит своих родителей" />
  <title>Ойбек — семья</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060610;
      --text: #f7f7ff;
      --muted: rgba(238,238,255,.62);
      --line: rgba(255,255,255,.11);
      --pink: #ff4f9a;
      --violet: #8957ff;
      --blue: #4ca8ff;
      --cyan: #57e9ff;
      --mx: 50%;
      --my: 50%;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(137,87,255,.16), transparent 31%),
        radial-gradient(circle at 82% 24%, rgba(76,168,255,.14), transparent 29%),
        radial-gradient(circle at 62% 86%, rgba(255,79,154,.13), transparent 34%),
        linear-gradient(135deg,#05050c 0%,#0a0914 48%,#060711 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background: radial-gradient(560px circle at var(--mx) var(--my), rgba(255,255,255,.065), transparent 42%);
      mix-blend-mode: screen;
    }

    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: .72;
      pointer-events: none;
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: .15;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .grid {
      position: fixed;
      inset: -20%;
      z-index: 1;
      pointer-events: none;
      opacity: .34;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at 50% 50%, #000 0 37%, transparent 74%);
      transform: perspective(900px) rotateX(62deg) translateY(33%);
      transform-origin: center;
    }

    .orb {
      position: fixed;
      z-index: 1;
      border-radius: 50%;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.13);
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 11%;
      border-radius: inherit;
      border: 1px solid rgba(255,255,255,.20);
      box-shadow: inset 0 0 38px rgba(255,255,255,.06);
    }

    .orb-a {
      width: clamp(240px,30vw,460px);
      aspect-ratio: 1;
      top: -8%;
      right: -8%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,.42), transparent 8%),
        radial-gradient(circle at 35% 35%, rgba(87,233,255,.22), transparent 28%),
        radial-gradient(circle at 58% 62%, rgba(137,87,255,.24), transparent 42%),
        rgba(255,255,255,.02);
      box-shadow: 0 0 100px rgba(76,168,255,.14), inset -30px -40px 80px rgba(137,87,255,.12);
    }

    .orb-b {
      width: clamp(170px,20vw,300px);
      aspect-ratio: 1;
      left: -4%;
      bottom: -9%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,.25), transparent 8%),
        radial-gradient(circle at 55% 58%, rgba(255,79,154,.22), transparent 44%),
        rgba(255,255,255,.018);
      box-shadow: 0 0 86px rgba(255,79,154,.14), inset 20px 10px 70px rgba(255,79,154,.10);
    }

    .shell {
      position: relative;
      z-index: 5;
      width: min(1240px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0;
      display: grid;
      place-items: center;
    }

    .topbar {
      position: absolute;
      top: 24px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 13px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.78);
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg,var(--pink),var(--violet));
      box-shadow: 0 0 24px rgba(255,79,154,.65);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.035);
      backdrop-filter: blur(16px);
      color: rgba(255,255,255,.66);
      font-size: 12px;
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #78ffbf;
      box-shadow: 0 0 16px rgba(120,255,191,.8);
    }

    .hero {
      position: relative;
      width: 100%;
      display: grid;
      place-items: center;
      perspective: 1200px;
    }

    .hero-card {
      position: relative;
      width: min(980px,100%);
      min-height: 610px;
      padding: clamp(28px,5vw,64px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: clamp(28px,4vw,48px);
      background:
        linear-gradient(135deg,rgba(255,255,255,.105),rgba(255,255,255,.028) 45%,rgba(255,255,255,.06)),
        rgba(12,12,24,.58);
      backdrop-filter: blur(28px) saturate(150%);
      box-shadow: 0 40px 120px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(255,255,255,.025);
      transform-style: preserve-3d;
      transition: transform .16s ease-out, border-color .25s ease;
      will-change: transform;
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(120deg,rgba(255,255,255,.32),rgba(137,87,255,.2),transparent 35% 65%,rgba(255,79,154,.18),rgba(255,255,255,.18));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      top: -170px;
      right: -130px;
      border-radius: 50%;
      background: radial-gradient(circle,rgba(137,87,255,.22),transparent 68%);
      filter: blur(10px);
      pointer-events: none;
    }

    .card-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom,transparent,#000 18%,#000 70%,transparent);
    }

    .content {
      position: relative;
      z-index: 3;
      min-height: 482px;
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      align-items: center;
      gap: clamp(28px,5vw,72px);
      transform: translateZ(36px);
    }

    .eyebrow {
      width: fit-content;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,.60);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow-line {
      width: 36px;
      height: 1px;
      background: linear-gradient(90deg,var(--pink),transparent);
    }

    h1 {
      margin: 0;
      max-width: 620px;
      font-size: clamp(64px,8.8vw,124px);
      line-height: .86;
      letter-spacing: -.075em;
      font-weight: 760;
      text-wrap: balance;
    }

    .name {
      display: block;
      background: linear-gradient(110deg,#fff 5%,#e7e5ff 46%,#b9ceff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 10px 30px rgba(137,87,255,.15));
    }

    .accent {
      display: block;
      margin-top: 10px;
      font-size: .33em;
      line-height: 1.12;
      letter-spacing: -.035em;
      font-weight: 560;
      color: rgba(245,245,255,.82);
    }

    .accent strong {
      font-weight: 650;
      background: linear-gradient(90deg,#ff84b9,#c2a4ff 46%,#78dfff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subcopy {
      max-width: 560px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(15px,1.5vw,18px);
      line-height: 1.7;
    }

    .visual {
      position: relative;
      min-height: 360px;
      display: grid;
      place-items: center;
    }

    .halo {
      position: absolute;
      width: min(340px,72vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(from 180deg,rgba(255,79,154,.22),rgba(137,87,255,.10),rgba(76,168,255,.22),rgba(255,79,154,.22));
      filter: blur(16px);
      animation: spin 14s linear infinite;
    }

    .ring {
      position: absolute;
      width: min(320px,68vw);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: inset 0 0 50px rgba(255,255,255,.025),0 0 70px rgba(137,87,255,.08);
      animation: float 7s ease-in-out infinite;
    }

    .ring::before,
    .ring::after {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,.10);
      animation: spin 18s linear infinite reverse;
    }

    .ring::after {
      inset: 24%;
      border-style: solid;
      border-color: rgba(255,255,255,.08);
      animation-duration: 11s;
      animation-direction: normal;
    }

    .heart-core {
      position: relative;
      z-index: 3;
      width: clamp(126px,15vw,168px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 36%;
      background:
        linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.045)),
        linear-gradient(135deg,rgba(255,79,154,.20),rgba(137,87,255,.16));
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 35px 80px rgba(0,0,0,.33),0 0 80px rgba(255,79,154,.15),inset 0 1px 0 rgba(255,255,255,.2);
      backdrop-filter: blur(24px);
      transform: rotate(8deg);
      animation: coreFloat 5s ease-in-out infinite;
    }

    .heart-core span {
      font-size: clamp(58px,8vw,78px);
      filter: drop-shadow(0 16px 25px rgba(255,42,120,.3));
      transform: rotate(-8deg);
      animation: heartbeat 2.8s ease-in-out infinite;
    }

    .orbit-dot {
      position: absolute;
      z-index: 5;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 18px rgba(255,255,255,.95),0 0 42px rgba(87,233,255,.7);
      animation: orbit 8s linear infinite;
    }

    .metric {
      position: absolute;
      z-index: 4;
      padding: 11px 14px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 16px;
      background: rgba(10,10,22,.48);
      backdrop-filter: blur(20px);
      box-shadow: 0 16px 38px rgba(0,0,0,.25);
      color: rgba(255,255,255,.78);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .metric b {
      display: block;
      margin-bottom: 3px;
      color: #fff;
      font-size: 15px;
      letter-spacing: -.01em;
      text-transform: none;
    }

    .metric-a { top: 12%; left: -3%; animation: float 6s ease-in-out infinite .4s; }
    .metric-b { right: -2%; bottom: 10%; animation: float 7s ease-in-out infinite 1s reverse; }

    .signature {
      position: absolute;
      left: clamp(28px,5vw,64px);
      right: clamp(28px,5vw,64px);
      bottom: 24px;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: rgba(255,255,255,.34);
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .signature .line {
      flex: 1;
      height: 1px;
      max-width: 130px;
      background: linear-gradient(90deg,rgba(255,255,255,.18),transparent);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes coreFloat { 0%,100% { transform: rotate(8deg) translateY(0) scale(1); } 50% { transform: rotate(5deg) translateY(-12px) scale(1.025); } }
    @keyframes heartbeat { 0%,100% { transform: rotate(-8deg) scale(1); } 10% { transform: rotate(-8deg) scale(1.08); } 20% { transform: rotate(-8deg) scale(1); } 30% { transform: rotate(-8deg) scale(1.055); } 46% { transform: rotate(-8deg) scale(1); } }
    @keyframes orbit { from { transform: rotate(0deg) translateX(152px) rotate(0deg); } to { transform: rotate(360deg) translateX(152px) rotate(-360deg); } }

    @media (max-width: 760px) {
      .shell { width: min(100% - 20px,1240px); padding: 80px 0 20px; }
      .topbar { top: 18px; }
      .status { display: none; }
      .hero-card { min-height: auto; padding: 30px 22px 68px; border-radius: 30px; }
      .content { min-height: 0; grid-template-columns: 1fr; gap: 18px; }
      h1 { font-size: clamp(58px,21vw,92px); }
      .accent { margin-top: 12px; font-size: .35em; }
      .subcopy { margin-top: 20px; }
      .visual { min-height: 310px; margin-top: 2px; }
      .metric-a { left: 1%; }
      .metric-b { right: 1%; }
      .signature { left: 22px; right: 22px; bottom: 20px; }
      @keyframes orbit { from { transform: rotate(0deg) translateX(132px) rotate(0deg); } to { transform: rotate(360deg) translateX(132px) rotate(-360deg); } }
    }

    @media (max-width: 420px) {
      .brand { font-size: 11px; }
      .metric { font-size: 9px; padding: 9px 11px; }
      .metric b { font-size: 13px; }
      .signature span:last-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .hero-card { transform: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="grid" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>OYBEK / FAMILY</div>
      <div class="status">Самое важное — рядом</div>
    </header>

    <main class="hero">
      <section class="hero-card" id="heroCard" aria-label="Посвящение семье">
        <div class="card-grid" aria-hidden="true"></div>
        <div class="content">
          <div class="copy">
            <div class="eyebrow"><span class="eyebrow-line"></span>Личное пространство</div>
            <h1>
              <span class="name">Я Ойбек</span>
              <span class="accent">и я <strong>люблю своих родителей</strong></span>
            </h1>
            <p class="subcopy">Семья — это место, где всё начинается: поддержка, тепло, характер и самые важные воспоминания.</p>
          </div>

          <div class="visual" aria-hidden="true">
            <div class="halo"></div>
            <div class="ring"></div>
            <div class="orbit-dot"></div>
            <div class="heart-core"><span>❤️</span></div>
            <div class="metric metric-a"><b>Навсегда</b>family first</div>
            <div class="metric metric-b"><b>∞ любви</b>без условий</div>
          </div>
        </div>

        <div class="signature">
          <span>Сделано с любовью</span>
          <span class="line"></span>
          <span>Ойбек · 2026</span>
        </div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const card = document.getElementById('heroCard');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!reduceMotion) {
        addEventListener('pointermove', (e) => {
          const x = e.clientX / innerWidth;
          const y = e.clientY / innerHeight;
          root.style.setProperty('--mx', e.clientX + 'px');
          root.style.setProperty('--my', e.clientY + 'px');
          if (innerWidth > 760) {
            card.style.transform = 'rotateX(' + ((.5-y)*6) + 'deg) rotateY(' + ((x-.5)*7) + 'deg)';
          }
        }, { passive: true });
        addEventListener('pointerleave', () => card.style.transform = '');
      }

      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let width = 0, height = 0, particles = [], raf = 0;

      function resize() {
        width = innerWidth;
        height = innerHeight;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        const count = Math.min(90, Math.max(36, Math.floor((width*height)/17000)));
        particles = Array.from({length:count}, () => ({
          x: Math.random()*width,
          y: Math.random()*height,
          r: Math.random()*1.15+.25,
          a: Math.random()*.5+.12,
          s: Math.random()*.16+.035
        }));
      }

      function draw() {
        ctx.clearRect(0,0,width,height);
        for (const p of particles) {
          p.y -= p.s;
          if (p.y < -4) { p.y = height+4; p.x = Math.random()*width; }
          ctx.beginPath();
          ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle = 'rgba(255,255,255,' + p.a + ')';
          ctx.fill();
        }
        if (!reduceMotion) raf = requestAnimationFrame(draw);
      }

      resize();
      draw();
      addEventListener('resize', resize, { passive: true });
      addEventListener('beforeunload', () => cancelAnimationFrame(raf));
    })();
  </script>
</body>
</html>
